apiVersion: v1
kind: Service

metadata:
  name: java-app-service

  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0c203b5502412cad9,subnet-0b94415084b9b74a1,subnet-0b792985785e6ee00

spec:
  selector:
    app: java-app

  type: LoadBalancer

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
