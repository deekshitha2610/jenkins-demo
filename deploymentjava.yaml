apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  labels:
    app: java-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-app

  template:
    metadata:
      labels:
        app: java-app

    spec:
      containers:
        - name: java-app

          image: 579017679500.dkr.ecr.us-east-1.amazonaws.com/helloworld:latest

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /helloworld/
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /helloworld/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
